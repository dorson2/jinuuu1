<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Today's mood</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; }
    .moods button {
      font-size: 24px;
      margin: 5px;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      height: 60px;
      margin-top: 10px;
    }
    ul { padding-left: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>How is your mood today?</h2>

    <div class="moods">
      <button onclick="selectMood('😎')">😎</button>
      <button onclick="selectMood('🙂')">🙂</button>
      <button onclick="selectMood('😐')">😐</button>
      <button onclick="selectMood('😵')">😵</button>
    </div>

    <textarea id="note" placeholder="One sentence"></textarea>
    <button onclick="saveLog()">Save</button>

    <h3>기록</h3>
    <ul id="log"></ul>
  </div>

  <script>
    let selectedMood = '';

    function selectMood(mood) {
      selectedMood = mood;
    }

    function saveLog() {
      if (!selectedMood) {
        alert('What is your emotion');
        return;
      }

      const note = document.getElementById('note').value;
      const date = new Date().toLocaleDateString();

      const li = document.createElement('li');
      li.textContent = `${date} ${selectedMood} - ${note}`;

      document.getElementById('log').appendChild(li);
      document.getElementById('note').value = '';
      selectedMood = '';
    }
  </script>
</body>
</html>
