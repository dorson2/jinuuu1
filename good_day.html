<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Today's mood</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 320px;
      max-width: 90%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2, h3 {
      text-align: center;
    }

    .moods {
      display: flex;
      justify-content: space-around;
      margin: 10px 0;
    }

    .moods button {
      font-size: 28px;
      padding: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 8px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    /* 🖱️ Hover 효과 */
    .moods button:hover {
      background: #f0f0f0;
      transform: scale(1.2);
    }

    /* 👉 선택된 상태 */
    .moods button.selected {
      background: #e0e0ff;
      transform: scale(1.25);
    }

    textarea {
      width: 100%;
      height: 60px;
      margin-top: 10px;
      padding: 6px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      border-radius: 8px;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    ul {
      padding-left: 18px;
    }

    /* 📱 모바일 최적화 */
    @media (max-width: 480px) {
      .moods button {
        font-size: 32px;
      }

      textarea {
        height: 70px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>How is your mood today?</h2>

    <div class="moods">
      <button onclick="selectMood(this, '😎')">😎</button>
      <button onclick="selectMood(this, '🙂')">🙂</button>
      <button onclick="selectMood(this, '😐')">😐</button>
      <button onclick="selectMood(this, '😵')">😵</button>
    </div>

    <textarea id="note" placeholder="One sentence"></textarea>
    <button onclick="saveLog()">Save</button>

    <h3>Log</h3>
    <ul id="log"></ul>
  </div>

  <script>
    let selectedMood = '';

    function selectMood(element, mood) {
      selectedMood = mood;

      // 기존 선택 제거
      document.querySelectorAll('.moods button')
        .forEach(btn => btn.classList.remove('selected'));

      // 현재 버튼 선택
      element.classList.add('selected');
    }

    function saveLog() {
      if (!selectedMood) {
        alert('What is your emotion?');
        return;
      }

      const note = document.getElementById('note').value;
      const date = new Date().toLocaleDateString();

      const li = document.createElement('li');
      li.textContent = `${date} ${selectedMood} - ${note}`;

      document.getElementById('log').appendChild(li);
      document.getElementById('note').value = '';
      selectedMood = '';

      document.querySelectorAll('.moods button')
        .forEach(btn => btn.classList.remove('selected'));
    }
  </script>
</body>
</html>
